name: OpenVX CI

# Replicates the GitLab CI pipeline (.gitlab-ci.yml): one build stage plus the
# eight OpenVX conformance test modes. Runs on pull requests and on every branch.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  OPENVX_DIR: ${{ github.workspace }}/install/Linux/x64/Debug
  VX_TEST_DATA_PATH: ${{ github.workspace }}/cts/test_data/

jobs:
  # ================================================================
  # Build stage — Release + Debug of the sample implementation
  # ================================================================
  build:
    name: Build OpenVX Sample Implementation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          uname -a
          cat /etc/lsb-release
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake make git python3 gcc g++
          gcc --version

      - name: Build (Release)
        run: |
          mkdir -p build/Linux/x64/Release && cd build/Linux/x64/Release
          cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Release -DBUILD_X64=1 && make -j$(nproc)

      - name: Build (Debug)
        run: |
          mkdir -p build/Linux/x64/Debug && cd build/Linux/x64/Debug
          cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Debug -DBUILD_X64=1 && make -j$(nproc)

  # ================================================================
  # Mode 1 — OpenVX Conformance for Vision
  # ================================================================
  conformance-vision:
    name: Conformance Vision
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake make git python3 gcc g++
      - name: Build sample impl
        run: |
          mkdir -p build/Linux/x64/Debug && cd build/Linux/x64/Debug
          cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$OPENVX_DIR" -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=bin -DBUILD_X64=1 -DOPENVX_CONFORMANCE_VISION=ON && make install -j$(nproc)
      - name: Build & run CTS
        run: |
          rm -rf "$GITHUB_WORKSPACE/build-cts" && mkdir -p "$GITHUB_WORKSPACE/build-cts" && cd "$GITHUB_WORKSPACE/build-cts"
          cmake -DOPENVX_INCLUDES="$OPENVX_DIR/include" -DOPENVX_LIBRARIES="$OPENVX_DIR/bin/libopenvx.so;$OPENVX_DIR/bin/libvxu.so;pthread;dl;m;rt" -DOPENVX_CONFORMANCE_VISION=ON "$GITHUB_WORKSPACE/cts/"
          cmake --build .
          LD_LIBRARY_PATH="$OPENVX_DIR/bin:./lib" ./bin/vx_test_conformance

  # ================================================================
  # Mode 2 — OpenVX Conformance for Vision & Enhanced Vision
  # ================================================================
  conformance-enhanced-vision:
    name: Conformance Vision Enhanced Vision
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake make git python3 gcc g++
      - name: Build sample impl
        run: |
          mkdir -p build/Linux/x64/Debug && cd build/Linux/x64/Debug
          cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$OPENVX_DIR" -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=bin -DBUILD_X64=1 -DOPENVX_CONFORMANCE_VISION=ON -DOPENVX_USE_ENHANCED_VISION=ON && make install -j$(nproc)
      - name: Build & run CTS
        run: |
          rm -rf "$GITHUB_WORKSPACE/build-cts" && mkdir -p "$GITHUB_WORKSPACE/build-cts" && cd "$GITHUB_WORKSPACE/build-cts"
          cmake -DOPENVX_INCLUDES="$OPENVX_DIR/include" -DOPENVX_LIBRARIES="$OPENVX_DIR/bin/libopenvx.so;$OPENVX_DIR/bin/libvxu.so;pthread;dl;m;rt" -DOPENVX_CONFORMANCE_VISION=ON -DOPENVX_USE_ENHANCED_VISION=ON "$GITHUB_WORKSPACE/cts/"
          cmake --build .
          LD_LIBRARY_PATH="$OPENVX_DIR/bin:./lib" ./bin/vx_test_conformance

  # ================================================================
  # Mode 3 — OpenVX Conformance for Neural Net
  # ================================================================
  conformance-neural-net:
    name: Conformance Neural Net
    runs-on: ubuntu-22.04
