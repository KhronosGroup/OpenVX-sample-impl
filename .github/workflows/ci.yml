      - name: Build sample impl
        run: |
          mkdir -p build/Linux/x64/Debug && cd build/Linux/x64/Debug
          cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$OPENVX_DIR" -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=bin -DBUILD_X64=1 -DOPENVX_CONFORMANCE_VISION=ON -DOPENVX_USE_ENHANCED_VISION=ON -DOPENVX_USE_PIPELINING=ON && make install -j$(nproc)
      - name: Build & run CTS
        run: |
          rm -rf "$GITHUB_WORKSPACE/build-cts" && mkdir -p "$GITHUB_WORKSPACE/build-cts" && cd "$GITHUB_WORKSPACE/build-cts"
          cmake -DOPENVX_INCLUDES="$OPENVX_DIR/include" -DOPENVX_LIBRARIES="$OPENVX_DIR/bin/libopenvx.so;$OPENVX_DIR/bin/libvxu.so;pthread;dl;m;rt" -DOPENVX_CONFORMANCE_VISION=ON -DOPENVX_USE_ENHANCED_VISION=ON -DOPENVX_USE_PIPELINING=ON "$GITHUB_WORKSPACE/cts/"
          cmake --build .
          LD_LIBRARY_PATH="$OPENVX_DIR/bin:./lib" ./bin/vx_test_conformance '--filter=GraphPipeline.*'

  # ================================================================
  # Mode 8 — Streaming (streaming APIs are still stubbed, so this job
  # is allowed to fail and surfaces only as a warning).
  # ================================================================
  conformance-streaming:
    name: Conformance Streaming
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake make git python3 gcc g++
