          LD_LIBRARY_PATH="$OPENVX_DIR/bin:./lib" \
            timeout 600 ./bin/vx_test_conformance --filter="*NNEF*"

  # ================================================================
  # Vision — functional groups (mirrors rustVX)
  # ================================================================
