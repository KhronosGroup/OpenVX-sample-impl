          cmake -DOPENVX_INCLUDES="$OPENVX_DIR/include" -DOPENVX_LIBRARIES="$OPENVX_DIR/bin/libopenvx.so;$OPENVX_DIR/bin/libvxu.so;pthread;dl;m;rt" -DOPENVX_CONFORMANCE_NEURAL_NETWORKS=ON "$GITHUB_WORKSPACE/cts/"
          cmake --build .
          LD_LIBRARY_PATH="$OPENVX_DIR/bin:./lib" ./bin/vx_test_conformance

  # ================================================================
  # Mode 4 — OpenVX Conformance for NNEF Import
  # ================================================================
  conformance-nnef-import:
    name: Conformance NNEF Import
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake make git python3 gcc g++
      - name: Build sample impl
        run: |
          mkdir -p build/Linux/x64/Debug && cd build/Linux/x64/Debug
          cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$OPENVX_DIR" -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=bin -DBUILD_X64=1 -DOPENVX_CONFORMANCE_NNEF_IMPORT=ON && make install -j$(nproc)
      - name: Build & run CTS
        run: |
          rm -rf "$GITHUB_WORKSPACE/build-cts" && mkdir -p "$GITHUB_WORKSPACE/build-cts" && cd "$GITHUB_WORKSPACE/build-cts"
          cmake -DOPENVX_INCLUDES="$OPENVX_DIR/include" -DOPENVX_LIBRARIES="$OPENVX_DIR/bin/libopenvx.so;$OPENVX_DIR/bin/libvxu.so;$OPENVX_DIR/bin/libnnef-lib.a;pthread;dl;m;rt;stdc++" -DOPENVX_CONFORMANCE_NNEF_IMPORT=ON -DCMAKE_C_FLAGS="-I$GITHUB_WORKSPACE/kernels/NNEF-Tools/parser/cpp/include" "$GITHUB_WORKSPACE/cts/"
          cmake --build .
          LD_LIBRARY_PATH="$OPENVX_DIR/bin:./lib" ./bin/vx_test_conformance

  # ================================================================
  # Mode 5 — Combined: Vision, Enhanced Vision, Neural Net,
  #          Import/Export, U1 Image
  # ================================================================
  conformance-combined:
    name: Conformance Combined
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake make git python3 gcc g++
      - name: Build sample impl
        run: |
          mkdir -p build/Linux/x64/Debug && cd build/Linux/x64/Debug
          cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$OPENVX_DIR" -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=bin -DBUILD_X64=1 -DOPENVX_CONFORMANCE_VISION=ON -DOPENVX_USE_ENHANCED_VISION=ON -DOPENVX_CONFORMANCE_NEURAL_NETWORKS=ON -DOPENVX_USE_NN=ON -DOPENVX_USE_IX=ON -DOPENVX_USE_U1=ON && make install -j$(nproc)
      - name: Build & run CTS
        run: |
          rm -rf "$GITHUB_WORKSPACE/build-cts" && mkdir -p "$GITHUB_WORKSPACE/build-cts" && cd "$GITHUB_WORKSPACE/build-cts"
          cmake -DOPENVX_INCLUDES="$OPENVX_DIR/include" -DOPENVX_LIBRARIES="$OPENVX_DIR/bin/libopenvx.so;$OPENVX_DIR/bin/libvxu.so;pthread;dl;m;rt" -DOPENVX_CONFORMANCE_VISION=ON -DOPENVX_USE_ENHANCED_VISION=ON -DOPENVX_CONFORMANCE_NEURAL_NETWORKS=ON -DOPENVX_USE_NN=ON -DOPENVX_USE_IX=ON -DOPENVX_USE_U1=ON "$GITHUB_WORKSPACE/cts/"
          cmake --build .
          LD_LIBRARY_PATH="$OPENVX_DIR/bin:./lib" ./bin/vx_test_conformance

  # ================================================================
  # Mode 6 — OpenVX Conformance for User Data Object
  # ================================================================
  conformance-user-data-object:
    name: Conformance User Data Object
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake make git python3 gcc g++
      - name: Build sample impl
        run: |
          mkdir -p build/Linux/x64/Debug && cd build/Linux/x64/Debug
          cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$OPENVX_DIR" -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=bin -DBUILD_X64=1 -DOPENVX_USE_USER_DATA_OBJECT=ON && make install -j$(nproc)
      - name: Build & run CTS
        run: |
          rm -rf "$GITHUB_WORKSPACE/build-cts" && mkdir -p "$GITHUB_WORKSPACE/build-cts" && cd "$GITHUB_WORKSPACE/build-cts"
          cmake -DOPENVX_INCLUDES="$OPENVX_DIR/include" -DOPENVX_LIBRARIES="$OPENVX_DIR/bin/libopenvx.so;$OPENVX_DIR/bin/libvxu.so;pthread;dl;m;rt" -DOPENVX_USE_USER_DATA_OBJECT=ON "$GITHUB_WORKSPACE/cts/"
