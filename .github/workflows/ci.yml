          LD_LIBRARY_PATH="$OPENVX_DIR/bin:./lib" \
            timeout 1200 ./bin/vx_test_conformance --filter="TensorNetworks.*:*NN*:VxKernelOfNNAndNNEF.*:VxParameterOfNNAndNNEF.*:MetaFormatOfNNAndNNEF.*:UserKernelsOfNNAndNNEF.*"

