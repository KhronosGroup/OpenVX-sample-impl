name: OpenVX CI

on:
  push:
    branches: [openvx_1.3, main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.webp'
  pull_request:
    branches: [openvx_1.3, main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.webp'

env:
  INSTALL_PREFIX: ${{ github.workspace }}/install

jobs:
  # ================================================================
  # Phase 1 — Build Debug (for tests + coverage)
  # ================================================================
  build-debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build OpenVX sample impl (Debug + extensions + coverage)
        run: |
          python3 Build.py \
            --os=linux --arch=64 --conf=Debug --build=true \
            --conf_vision \
            --enh_vision \
            --conf_nn \
            --nn \
            --ix \
            --pipelining \
            --streaming \
            --userdataobj \
            --c_flags="-fprofile-arcs -ftest-coverage" \
            --cpp_flags="-fprofile-arcs -ftest-coverage"

      - name: Upload debug build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvx-debug
          path: |
            ${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/
            build/Linux/x64/Debug/
            include/
          retention-days: 7

  # ================================================================
  # Phase 1 — Build Release (for performance benchmarking)
  # ================================================================
  build-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build OpenVX sample impl (Release + extensions)
        run: |
          python3 Build.py \
            --os=linux --arch=64 --conf=Release --build=true \
            --conf_vision \
            --enh_vision \
            --conf_nn \
            --nn \
            --ix \
            --pipelining \
            --streaming \
            --userdataobj

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvx-release
          path: |
            ${{ env.INSTALL_PREFIX }}/Linux/x64/Release/
            include/
          retention-days: 7

  # ================================================================
  # Phase 1 — Build CTS (against debug build)
  # ================================================================
  build-cts:
    needs: build-debug
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-debug
          path: ${{ github.workspace }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Patch CTS test_module include dirs
        run: |
          sed -i "s|\${CMAKE_SOURCE_DIR}/include|\${CMAKE_SOURCE_DIR}/include ${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/include|g" cts/test_conformance/test_module/CMakeLists.txt

      - name: Build OpenVX CTS
        env:
          INC: ${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/include
        run: |
          mkdir -p build-cts
          cd build-cts
          cmake \
            -DCMAKE_C_FLAGS="-I$INC" \
            -DCMAKE_CXX_FLAGS="-I$INC" \
            -DOPENVX_INCLUDES="$INC" \
            -DOPENVX_LIBRARIES="${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/lib/libopenvx.so;${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/lib/libvxu.so;pthread;dl;m;rt" \
            -DOPENVX_CONFORMANCE_VISION=ON \
            -DOPENVX_USE_ENHANCED_VISION=ON \
            -DOPENVX_CONFORMANCE_NEURAL_NETWORKS=ON \
            -DOPENVX_USE_NN=ON \
            -DOPENVX_USE_NN_16=ON \
            -DOPENVX_USE_IX=ON \
            -DOPENVX_USE_PIPELINING=ON \
            -DOPENVX_USE_STREAMING=ON \
            -DOPENVX_USE_USER_DATA_OBJECT=ON \
            ../cts/
          cmake --build . --parallel $(nproc)

      - name: Upload CTS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvx-cts
          path: |
            build-cts/
            cts/test_data/
          retention-days: 7

  # ================================================================
  # Phase 2 — Run CTS smoke / baseline + collect coverage
  # ================================================================
  cts-baseline:
    needs: build-cts
    runs-on: ubuntu-22.04
    steps:
      - name: Download CTS artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-cts
          path: ${{ github.workspace }}

      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-debug
          path: ${{ github.workspace }}

      - name: Run CTS baseline / smoke tests
        env:
          GCOV_PREFIX: ${{ github.workspace }}/gcov-cts-baseline
        run: |
          cd build-cts
          chmod +x bin/vx_test_conformance
          export LD_LIBRARY_PATH=${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/cts/test_data/
          BUILD_DIR="${{ github.workspace }}/build/Linux/x64/Debug"
          export GCOV_PREFIX_STRIP=$(($(echo "$BUILD_DIR" | tr '/' '\n' | wc -l) - 1))
          timeout 300 ./bin/vx_test_conformance \
            --filter="GraphBase.*:SmokeTestBase.*:SmokeTest.*:TargetBase.*:Target.*:Logging.*" \
            --verbose || true

      - name: Upload coverage raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcov-cts-baseline
          path: ${{ github.workspace }}/gcov-cts-baseline/
          if-no-files-found: ignore
          retention-days: 7

  # ================================================================
  # Phase 2 — CTS Core Vision kernels
  # ================================================================
  cts-vision-kernels:
    needs: build-cts
    runs-on: ubuntu-22.04
    steps:
      - name: Download CTS artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-cts
          path: ${{ github.workspace }}

      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-debug
          path: ${{ github.workspace }}

      - name: Run CTS — Core Vision kernels
        env:
          GCOV_PREFIX: ${{ github.workspace }}/gcov-cts-vision-kernels
        run: |
          cd build-cts
          chmod +x bin/vx_test_conformance
          export LD_LIBRARY_PATH=${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/cts/test_data/
          BUILD_DIR="${{ github.workspace }}/build/Linux/x64/Debug"
          export GCOV_PREFIX_STRIP=$(($(echo "$BUILD_DIR" | tr '/' '\n' | wc -l) - 1))
          timeout 1200 ./bin/vx_test_conformance \
            --filter="Box3x3.*:Gaussian3x3.*:Median3x3.*:Dilate3x3.*:Erode3x3.*:Sobel3x3.*:Magnitude.*:Phase.*:NonLinearFilter.*:Convolve.*:EqualizeHistogram.*:ColorConvert.*:ChannelExtract.*:ChannelCombine.*:vxConvertDepth.*:vxuConvertDepth.*:vxAddSub.*:vxuAddSub.*:vxMultiply.*:vxuMultiply.*:vxBinOp8u.*:vxuBinOp8u.*:vxBinOp16s.*:vxuBinOp16s.*:vxNot.*:vxuNot.*:WeightedAverage.*:Threshold.*:Scale.*:WarpAffine.*:WarpPerspective.*:Remap.*:HalfScaleGaussian.*:HarrisCorners.*:FastCorners.*:vxCanny.*:vxuCanny.*:MeanStdDev.*:MinMaxLoc.*:Integral.*:GaussianPyramid.*:LaplacianPyramid.*:LaplacianReconstruct.*:OptFlowPyrLK.*:Convolution.*:Histogram.*" \
            --verbose

      - name: Upload coverage raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcov-cts-vision-kernels
          path: ${{ github.workspace }}/gcov-cts-vision-kernels/
          if-no-files-found: ignore
          retention-days: 7

  # ================================================================
  # Phase 2 — CTS Enhanced Vision
  # ================================================================
  cts-enhanced-vision:
    needs: build-cts
    runs-on: ubuntu-22.04
    steps:
      - name: Download CTS artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-cts
          path: ${{ github.workspace }}

      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-debug
          path: ${{ github.workspace }}

      - name: Run CTS — Enhanced Vision
        env:
          GCOV_PREFIX: ${{ github.workspace }}/gcov-cts-enhanced-vision
        run: |
          cd build-cts
          chmod +x bin/vx_test_conformance
          export LD_LIBRARY_PATH=${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/cts/test_data/
          BUILD_DIR="${{ github.workspace }}/build/Linux/x64/Debug"
          export GCOV_PREFIX_STRIP=$(($(echo "$BUILD_DIR" | tr '/' '\n' | wc -l) - 1))
          timeout 1200 ./bin/vx_test_conformance \
            --filter="GraphEnhanced.*:HogCells.*:HogFeatures.*:MatchTemplate.*:LBP.*:Copy.*:Nonmaxsuppression.*:Houghlinesp.*:BilateralFilter.*:ControlFlow.*:TensorOp.*:Min.*:Max.*:Tensor.*:TensorEnhanced.*" \
            --verbose

      - name: Upload coverage raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcov-cts-enhanced-vision
          path: ${{ github.workspace }}/gcov-cts-enhanced-vision/
          if-no-files-found: ignore
          retention-days: 7

  # ================================================================
  # Phase 2 — CTS Neural Networks
  # NOTE: TensorNetworks.AlexNetTestNetwork fails with "failed to load weights"
  #       (missing test_data file — pre-existing, not a regression)
  # ================================================================
  cts-neural-networks:
    needs: build-cts
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Download CTS artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-cts
          path: ${{ github.workspace }}

      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-debug
          path: ${{ github.workspace }}

      - name: Run CTS — Neural Networks
        env:
          GCOV_PREFIX: ${{ github.workspace }}/gcov-cts-neural-networks
        run: |
          cd build-cts
          chmod +x bin/vx_test_conformance
          export LD_LIBRARY_PATH=${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/cts/test_data/
          BUILD_DIR="${{ github.workspace }}/build/Linux/x64/Debug"
          export GCOV_PREFIX_STRIP=$(($(echo "$BUILD_DIR" | tr '/' '\n' | wc -l) - 1))
          timeout 1200 ./bin/vx_test_conformance \
            --filter="TensorNetworks.*:-TensorNetworks.AlexNetTestNetwork:*NN*:VxKernelOfNNAndNNEF.*:VxParameterOfNNAndNNEF.*:MetaFormatOfNNAndNNEF.*:UserKernelsOfNNAndNNEF.*" \
            --verbose

      - name: Upload coverage raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcov-cts-neural-networks
          path: ${{ github.workspace }}/gcov-cts-neural-networks/
          if-no-files-found: ignore
          retention-days: 7

  # ================================================================
  # Phase 2 — CTS Import / Export (IX)
  # ================================================================
  cts-ix:
    needs: build-cts
    runs-on: ubuntu-22.04
    steps:
      - name: Download CTS artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-cts
          path: ${{ github.workspace }}

      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-debug
          path: ${{ github.workspace }}

      - name: Run CTS — Import/Export
        env:
          GCOV_PREFIX: ${{ github.workspace }}/gcov-cts-ix
        run: |
          cd build-cts
          chmod +x bin/vx_test_conformance
          export LD_LIBRARY_PATH=${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/cts/test_data/
          BUILD_DIR="${{ github.workspace }}/build/Linux/x64/Debug"
          export GCOV_PREFIX_STRIP=$(($(echo "$BUILD_DIR" | tr '/' '\n' | wc -l) - 1))
          timeout 600 ./bin/vx_test_conformance \
            --filter="ExtensionObject.*" \
            --verbose

      - name: Upload coverage raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcov-cts-ix
          path: ${{ github.workspace }}/gcov-cts-ix/
          if-no-files-found: ignore
          retention-days: 7

  # ================================================================
  # Phase 2 — CTS Graph features (delay, ROI, callback, pipeline, streaming)
  # NOTE: GraphPipeline.* tests fail because C model target pipelining is incomplete
  #       (pre-existing, not a regression)
  # ================================================================
  cts-graph-features:
    needs: build-cts
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Download CTS artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-cts
          path: ${{ github.workspace }}

      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-debug
          path: ${{ github.workspace }}

      - name: Run CTS — Graph Delay / ROI / Callbacks / Pipeline / Streaming
        env:
          GCOV_PREFIX: ${{ github.workspace }}/gcov-cts-graph-features
        run: |
          cd build-cts
          chmod +x bin/vx_test_conformance
          export LD_LIBRARY_PATH=${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/cts/test_data/
          BUILD_DIR="${{ github.workspace }}/build/Linux/x64/Debug"
          export GCOV_PREFIX_STRIP=$(($(echo "$BUILD_DIR" | tr '/' '\n' | wc -l) - 1))
          timeout 600 ./bin/vx_test_conformance \
            --filter="GraphDelay.*:GraphROI.*:GraphCallback.*:GraphPipeline.*:GraphStreaming.*:GraphDelayTensor.*" \
            --verbose || true

      - name: Upload coverage raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcov-cts-graph-features
          path: ${{ github.workspace }}/gcov-cts-graph-features/
          if-no-files-found: ignore
          retention-days: 7

  # ================================================================
  # Phase 2 — CTS Data objects
  # ================================================================
  cts-data-objects:
    needs: build-cts
    runs-on: ubuntu-22.04
    steps:
      - name: Download CTS artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-cts
          path: ${{ github.workspace }}

      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-debug
          path: ${{ github.workspace }}

      - name: Run CTS — Data objects / Arrays / Scalars / Tensors
        env:
          GCOV_PREFIX: ${{ github.workspace }}/gcov-cts-data-objects
        run: |
          cd build-cts
          chmod +x bin/vx_test_conformance
          export LD_LIBRARY_PATH=${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/cts/test_data/
          BUILD_DIR="${{ github.workspace }}/build/Linux/x64/Debug"
          export GCOV_PREFIX_STRIP=$(($(echo "$BUILD_DIR" | tr '/' '\n' | wc -l) - 1))
          timeout 600 ./bin/vx_test_conformance \
            --filter="Array.*:Image.*:Scalar.*:Matrix.*:Distribution.*:LUT.*:Remap.*:Tensor.*:ObjectArray.*:UserDataObject.*:vxCreateImageFromChannel.*:vxCopyImagePatch.*:vxMapImagePatch.*:vxCopyRemapPatch.*:vxMapRemapPatch.*" \
            --verbose

      - name: Upload coverage raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcov-cts-data-objects
          path: ${{ github.workspace }}/gcov-cts-data-objects/
          if-no-files-found: ignore
          retention-days: 7

  # ================================================================
  # Phase 2 — CTS User-defined kernels
  # ================================================================
  cts-user-kernels:
    needs: build-cts
    runs-on: ubuntu-22.04
    steps:
      - name: Download CTS artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-cts
          path: ${{ github.workspace }}

      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-debug
          path: ${{ github.workspace }}

      - name: Run CTS — User kernels / nodes
        env:
          GCOV_PREFIX: ${{ github.workspace }}/gcov-cts-user-kernels
        run: |
          cd build-cts
          chmod +x bin/vx_test_conformance
          export LD_LIBRARY_PATH=${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/cts/test_data/
          BUILD_DIR="${{ github.workspace }}/build/Linux/x64/Debug"
          export GCOV_PREFIX_STRIP=$(($(echo "$BUILD_DIR" | tr '/' '\n' | wc -l) - 1))
          timeout 600 ./bin/vx_test_conformance \
            --filter="UserNode.*" \
            --verbose

      - name: Upload coverage raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcov-cts-user-kernels
          path: ${{ github.workspace }}/gcov-cts-user-kernels/
          if-no-files-found: ignore
          retention-days: 7

  # ================================================================
  # Phase 2 — CTS Graph core
  # ================================================================
  cts-graph-core:
    needs: build-cts
    runs-on: ubuntu-22.04
    steps:
      - name: Download CTS artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-cts
          path: ${{ github.workspace }}

      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-debug
          path: ${{ github.workspace }}

      - name: Run CTS — Core graph construction / verification / execution
        env:
          GCOV_PREFIX: ${{ github.workspace }}/gcov-cts-graph-core
        run: |
          cd build-cts
          chmod +x bin/vx_test_conformance
          export LD_LIBRARY_PATH=${{ env.INSTALL_PREFIX }}/Linux/x64/Debug/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/cts/test_data/
          BUILD_DIR="${{ github.workspace }}/build/Linux/x64/Debug"
          export GCOV_PREFIX_STRIP=$(($(echo "$BUILD_DIR" | tr '/' '\n' | wc -l) - 1))
          timeout 1200 ./bin/vx_test_conformance \
            --filter="Graph.*:-GraphDelay.*:-GraphROI.*:-GraphCallback.*:-GraphPipeline.*:-GraphStreaming.*:-GraphDelayTensor.*" \
            --verbose

      - name: Upload coverage raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcov-cts-graph-core
          path: ${{ github.workspace }}/gcov-cts-graph-core/
          if-no-files-found: ignore
          retention-days: 7

  # ================================================================
  # Phase 3 — Build base ref release (PR only, for perf comparison)
  # ================================================================
  build-main:
    name: Build Release (${{ github.base_ref }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build OpenVX sample impl (Release) from ${{ github.base_ref }}
        run: |
          python3 Build.py \
            --os=linux --arch=64 --conf=Release --build=true \
            --conf_vision \
            --enh_vision \
            --conf_nn \
            --nn \
            --ix \
            --pipelining \
            --streaming \
            --userdataobj

      - name: Upload main release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvx-release-main
          path: |
            ${{ env.INSTALL_PREFIX }}/Linux/x64/Release/
            include/
          retention-days: 7

  # ================================================================
  # Phase 3 — Performance gate: openvx-mark benchmark PR vs base ref
  #
  # Adapted from the rustVX workflow. This job builds the same openvx-mark
  # workload twice on the SAME runner — once against the PR's Release build
  # and once against the merge target's Release build — then runs an
  # automated perf gate with configurable geomean and per-kernel floors.
  # ================================================================
  perf-gate:
    name: Perf gate (PR vs ${{ github.base_ref }})
    if: github.event_name == 'pull_request'
    needs:
      - build-release
      - build-main
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3

      - name: Download PR release build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-release
          path: ${{ github.workspace }}/pr-build

      - name: Download base ref release build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-release-main
          path: ${{ github.workspace }}/main-build

      - name: Stage PR OpenVX libraries
        id: pr_openvx
        run: |
          set -euo pipefail
          LIB_DIR=$(find ${{ github.workspace }}/pr-build -type d -name lib | head -n1)
          if [ -z "$LIB_DIR" ]; then
            echo "::error::Could not locate PR lib directory"
            find ${{ github.workspace }}/pr-build -maxdepth 4 -type d
            exit 1
          fi
          # Headers are installed as a sibling of the lib directory
          INC_DIR=$(dirname "$LIB_DIR")/include
          echo "lib_dir=$LIB_DIR" >> "$GITHUB_OUTPUT"
          echo "include_dir=$INC_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$LIB_DIR"
          ls -la "$INC_DIR"

      - name: Stage base ref OpenVX libraries
        id: main_openvx
        run: |
          set -euo pipefail
          LIB_DIR=$(find ${{ github.workspace }}/main-build -type d -name lib | head -n1)
          if [ -z "$LIB_DIR" ]; then
            echo "::error::Could not locate base ref lib directory"
            find ${{ github.workspace }}/main-build -maxdepth 4 -type d
            exit 1
          fi
          # Headers are installed as a sibling of the lib directory
          INC_DIR=$(dirname "$LIB_DIR")/include
          echo "lib_dir=$LIB_DIR" >> "$GITHUB_OUTPUT"
          echo "include_dir=$INC_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$LIB_DIR"
          ls -la "$INC_DIR"

      - name: Clone openvx-mark
        run: |
          git clone --depth 1 https://github.com/kiritigowda/openvx-mark.git \
            ${{ github.workspace }}/openvx-mark

      - name: Build openvx-mark against PR release
        run: |
          mkdir -p ${{ github.workspace }}/openvx-mark/build-pr
          cd ${{ github.workspace }}/openvx-mark/build-pr
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENVX_INCLUDES=${{ steps.pr_openvx.outputs.include_dir }} \
            -DOPENVX_LIB_DIR=${{ steps.pr_openvx.outputs.lib_dir }} \
            ..
          cmake --build . -j$(nproc)

      - name: Build openvx-mark against base ref release
        run: |
          mkdir -p ${{ github.workspace }}/openvx-mark/build-main
          cd ${{ github.workspace }}/openvx-mark/build-main
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENVX_INCLUDES=${{ steps.main_openvx.outputs.include_dir }} \
            -DOPENVX_LIB_DIR=${{ steps.main_openvx.outputs.lib_dir }} \
            ..
          cmake --build . -j$(nproc)

      # Per-library "warmup + measure" cycles, back-to-back on the same VM
      # so both libraries see comparable cache/thermal state.
      - name: Bench + perf gate (with retry for VM noise)
        run: |
          set -uo pipefail

          PR_LIB=${{ steps.pr_openvx.outputs.lib_dir }}
          MAIN_LIB=${{ steps.main_openvx.outputs.lib_dir }}
          PR_BUILD=${{ github.workspace }}/openvx-mark/build-pr
          MAIN_BUILD=${{ github.workspace }}/openvx-mark/build-main
          PR_JSON=$PR_BUILD/benchmark_results/benchmark_results.json
          MAIN_JSON=$MAIN_BUILD/benchmark_results/benchmark_results.json

          MAX_RETRIES=3
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo ""
            echo "=== Perf gate attempt $attempt / $MAX_RETRIES ==="
            echo ""

            # Bench PR
            cd "$PR_BUILD"
            export LD_LIBRARY_PATH=$PR_LIB
            timeout 300 ./openvx-mark --resolution FHD --iterations 5 --warmup 0 \
              --output /tmp/warmup-pr-throwaway-$attempt >/dev/null 2>&1 || true
            timeout 300 ./openvx-mark --resolution FHD --iterations 20 --warmup 5

            # Bench base ref
            cd "$MAIN_BUILD"
            export LD_LIBRARY_PATH=$MAIN_LIB
            timeout 300 ./openvx-mark --resolution FHD --iterations 5 --warmup 0 \
              --output /tmp/warmup-main-throwaway-$attempt >/dev/null 2>&1 || true
            timeout 300 ./openvx-mark --resolution FHD --iterations 20 --warmup 5

            if [ ! -f "$PR_JSON" ] || [ ! -f "$MAIN_JSON" ]; then
              echo "::error::Missing benchmark JSONs on attempt $attempt."
              ls -la "$(dirname "$PR_JSON")" "$(dirname "$MAIN_JSON")" 2>/dev/null || true
              if [ $attempt -eq $MAX_RETRIES ]; then exit 1; fi
              continue
            fi

            set +e
            python3 ${{ github.workspace }}/.github/scripts/perf_gate.py \
              "$MAIN_JSON" "$PR_JSON" \
              --main-label "${{ github.base_ref }}" \
              --pr-label "PR" \
              --geomean-floor 0.97 \
              --kernel-floor 0.90 \
              --warn-floor 0.95 \
              --max-cv 5.0 \
              --skip-name LaplacianPyramid \
              --skip-name LaplacianReconstruct \
              --summary-out "$GITHUB_STEP_SUMMARY"
            gate_exit=$?
            set -e

            if [ $gate_exit -eq 0 ]; then
              echo ""
              echo "✅ Perf gate PASSED on attempt $attempt"
              echo ""
              exit 0
            else
              echo ""
              echo "⚠️ Perf gate FAILED on attempt $attempt"
              echo ""
              rm -f "$PR_JSON" "$MAIN_JSON"
              if [ $attempt -eq $MAX_RETRIES ]; then
                echo "::error::Perf gate failed after $MAX_RETRIES attempts. Likely real regression."
                exit 1
              fi
            fi
          done

      - name: Upload PR benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-results-pr
          path: ${{ github.workspace }}/openvx-mark/build-pr/benchmark_results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload base ref benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-results-main
          path: ${{ github.workspace }}/openvx-mark/build-main/benchmark_results/
          if-no-files-found: ignore
          retention-days: 7

  # ================================================================
  # Phase 3 — Benchmark comparison against rustVX (same runner)
  #
  # Mirrors rustVX's Khronos-vs-rustVX benchmark job. On every PR and
  # push, download the pre-built rustVX release artifact (built by the
  # rustVX project) and run openvx-mark against it on the same VM that
  # benchmarks the Khronos sample, producing a direct same-hardware
  # comparison. This is informational only (continue-on-error).
  # ================================================================
  benchmark-vs-rustvx:
    name: Benchmark vs rustVX (informational)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/openvx_1.3'
    needs:
      - build-release
      - cts-baseline
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3

      - name: Download Khronos sample release artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvx-release
          path: ${{ github.workspace }}/khronos-pkg

      - name: Stage Khronos OpenVX libraries
        id: khronos
        run: |
          set -euo pipefail
          LIB_DIR=$(find ${{ github.workspace }}/khronos-pkg -type d -name lib | head -n1)
          if [ -z "$LIB_DIR" ]; then
            echo "::error::Could not locate Khronos lib directory"
            find ${{ github.workspace }}/khronos-pkg -maxdepth 3 -type d
            exit 1
          fi
          # Headers are installed as a sibling of the lib directory
          INC_DIR=$(dirname "$LIB_DIR")/include
          echo "lib_dir=$LIB_DIR" >> "$GITHUB_OUTPUT"
          echo "include_dir=$INC_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$LIB_DIR"

      - name: Fetch latest rustVX release artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: kiritigowda/rustVX
          branch: main
          workflow: conformance.yml
          name: build-artifacts
          path: ${{ github.workspace }}/rustvx-pkg
          if_no_artifact_found: warn

      - name: Stage rustVX library
        id: rustvx
        if: hashFiles('rustvx-pkg/**/libopenvx_ffi.so') != ''
        run: |
          set -euo pipefail
          LIB_SRC=$(find ${{ github.workspace }}/rustvx-pkg -name "libopenvx_ffi.so" -print -quit)
          LIB_DIR=$(dirname "$LIB_SRC")
          INC_DIR=${{ github.workspace }}/rustvx-pkg/include
          cd "$LIB_DIR"
          ln -sf libopenvx_ffi.so libopenvx.so
          ln -sf libopenvx_ffi.so libvxu.so
          echo "lib_dir=$LIB_DIR" >> "$GITHUB_OUTPUT"
          echo "include_dir=$INC_DIR" >> "$GITHUB_OUTPUT"
          ls -la libopenvx*.so libvxu*.so

      - name: Clone openvx-mark
        run: |
          git clone --depth 1 https://github.com/kiritigowda/openvx-mark.git \
            ${{ github.workspace }}/openvx-mark

      - name: Build openvx-mark against Khronos sample
        run: |
          mkdir -p ${{ github.workspace }}/openvx-mark/build-khronos
          cd ${{ github.workspace }}/openvx-mark/build-khronos
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENVX_INCLUDES=${{ steps.khronos.outputs.include_dir }} \
            -DOPENVX_LIB_DIR=${{ steps.khronos.outputs.lib_dir }} \
            ..
          cmake --build . -j$(nproc)

      - name: Build openvx-mark against rustVX
        if: steps.rustvx.outputs.lib_dir != ''
        run: |
          mkdir -p ${{ github.workspace }}/openvx-mark/build-rustvx
          cd ${{ github.workspace }}/openvx-mark/build-rustvx
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENVX_INCLUDES=${{ steps.rustvx.outputs.include_dir }} \
            -DOPENVX_LIB_DIR=${{ steps.rustvx.outputs.lib_dir }} \
            ..
          cmake --build . -j$(nproc)

      - name: Run benchmark (Khronos sample)
        run: |
          cd ${{ github.workspace }}/openvx-mark/build-khronos
          export LD_LIBRARY_PATH=${{ steps.khronos.outputs.lib_dir }}
          timeout 300 ./openvx-mark --resolution FHD --iterations 20 --warmup 5

      - name: Run benchmark (rustVX)
        if: steps.rustvx.outputs.lib_dir != ''
        run: |
          cd ${{ github.workspace }}/openvx-mark/build-rustvx
          export LD_LIBRARY_PATH=${{ steps.rustvx.outputs.lib_dir }}
          timeout 300 ./openvx-mark --resolution FHD --iterations 20 --warmup 5

      - name: Compare Khronos sample vs rustVX
        if: steps.rustvx.outputs.lib_dir != ''
        run: |
          set -euo pipefail
          KHRONOS=${{ github.workspace }}/openvx-mark/build-khronos/benchmark_results/benchmark_results.json
          RUSTVX=${{ github.workspace }}/openvx-mark/build-rustvx/benchmark_results/benchmark_results.json
          if [ ! -f "$KHRONOS" ] || [ ! -f "$RUSTVX" ]; then
            echo "Skipping comparison — one or both benchmark results missing"
            exit 0
          fi
          python3 ${{ github.workspace }}/openvx-mark/scripts/compare_reports.py \
            "$KHRONOS" "$RUSTVX" \
            --output ${{ github.workspace }}/openvx-mark/comparison
          cat ${{ github.workspace }}/openvx-mark/comparison.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-vs-rustvx-results
          path: |
            ${{ github.workspace }}/openvx-mark/build-*/benchmark_results/
            ${{ github.workspace }}/openvx-mark/comparison.*
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Coverage Stage — merge gcov data from all test jobs after tests complete
  # ===========================================================================
  coverage-summary:
    name: Code coverage summary
    runs-on: ubuntu-22.04
    if: always() && needs.build-debug.result == 'success'
    needs:
      - build-debug
      - cts-baseline
      - cts-vision-kernels
      - cts-enhanced-vision
      - cts-neural-networks
      - cts-ix
      - cts-graph-features
      - cts-data-objects
      - cts-user-kernels
      - cts-graph-core
    steps:
      - uses: actions/checkout@v4

      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Download debug build (for .gcno files)
        uses: actions/download-artifact@v4
        with:
          name: openvx-debug
          path: ${{ github.workspace }}

      - name: Download all gcov artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gcov-cts-*
          path: all-gcov
          merge-multiple: true

      - name: Merge gcov data into build tree
        run: |
          set -euo pipefail
          BUILD_DIR="${{ github.workspace }}/build/Linux/x64/Debug"
          mkdir -p "$BUILD_DIR"
          echo "GCDA files found:"
          find all-gcov -name '*.gcda' -type f | head -50
          COUNT=$(find all-gcov -name '*.gcda' -type f | wc -l)
          echo "Total .gcda files: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No .gcda files collected — coverage will be empty"
            exit 0
          fi
          # Each gcov artifact was emitted with GCOV_PREFIX_STRIP set so the
          # file paths are relative to BUILD_DIR. Copy them back into the
          # build tree next to their matching .gcno files.
          find all-gcov -name '*.gcda' -type f | while read -r gcda; do
            rel="${gcda#all-gcov/}"
            dest="$BUILD_DIR/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$gcda" "$dest"
          done
          echo "Merged .gcda files into $BUILD_DIR"

      - name: Collect code-coverage data
        run: |
          set -euo pipefail
          BUILD_DIR="${{ github.workspace }}/build/Linux/x64/Debug"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "::warning::Build directory missing — cannot collect coverage"
            exit 0
          fi
          lcov --directory "$BUILD_DIR" --capture --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '${{ github.workspace }}/cts/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.info
          if-no-files-found: ignore
          retention-days: 7
