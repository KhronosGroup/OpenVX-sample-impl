      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake make git python3 gcc g++
      - name: Build sample impl
        run: |
          mkdir -p build/Linux/x64/Debug && cd build/Linux/x64/Debug
          cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$OPENVX_DIR" -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=bin -DBUILD_X64=1 -DOPENVX_CONFORMANCE_NEURAL_NETWORKS=ON && make install -j$(nproc)
      - name: Build & run CTS
        run: |
