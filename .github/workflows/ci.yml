  # ================================================================
  # Mode 7 — Vision, Enhanced Vision & Pipelining
  # ================================================================
  conformance-pipelining:
    name: Conformance Pipelining
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
